[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegir-shared-gaussian"
version = "0.2.0"
description = "Shared 2D Gaussian geometry, BRDF, and area-emitter inverse rendering."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pillow>=10.0",
    "plyfile>=1.0,<1.1",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
eval = ["lpips>=0.1.4", "torchvision>=0.17"]

[project.scripts]
aegir = "aegir.cli:main"

[tool.setuptools.packages.find]
include = ["aegir*"]

[tool.ruff]
line-length = 110
target-version = "py310"
